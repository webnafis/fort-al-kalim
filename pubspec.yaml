name: fort_al_kalim
description: Fort Al-Kalim - Arabic-English vocabulary battle game
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Game Engine
  flame: ^1.18.0
  flame_audio: ^2.10.0

  # Firebase Suite
  firebase_core: ^4.10.0
  firebase_auth: ^6.5.2
  cloud_firestore: ^6.5.0
  firebase_messaging: ^16.3.0

  # Google Auth + Play Games
  google_sign_in: ^6.2.1
  # Local Storage
  sqflite: ^2.3.3+1
  sqflite_common_ffi: ^2.3.3
  sqflite_common_ffi_web: ^0.4.3
  path: ^1.9.0
  url_launcher: ^6.3.0

  # Audio & Speech
  just_audio: ^0.9.40
  flutter_tts: ^4.0.2
  record: ^6.0.0
  path_provider: ^2.1.3

  # Networking & Images
  cached_network_image: ^3.4.1
  http: ^1.2.2

  # State Management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Navigation
  go_router: ^14.2.7
  uuid: ^4.4.0

  # UI / Utils
  google_fonts: ^6.2.1
  lottie: ^3.1.2
  shimmer: ^3.0.0
  shared_preferences: ^2.3.2
  intl: ^0.19.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.11
  riverpod_generator: ^2.4.3

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/images/achievements/
    - assets/audio/

  # We will use the google_fonts package instead of local fonts!
